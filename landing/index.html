<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomies — Find your next room</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">Roomies</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain" aria-controls="navbarMain"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="#search">Search</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Publish a Room</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Log In</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-primary ms-lg-2" href="#">Sign Up</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero bg-light text-center py-5" aria-labelledby="hero-heading">
      <div class="container py-5">
        <h1 id="hero-heading" class="display-4 fw-bold">Find a room. Find your next home.</h1>
        <p class="lead col-lg-8 mx-auto text-muted">
          Roomies connects people with a free room in a shared home to people looking for a place
          to live — browse listings, apply, visit, and move in, all in one place.
        </p>
        <a href="#search" class="btn btn-primary btn-lg mt-3">Find a room</a>
      </div>
    </section>

    <section id="search" class="py-5" aria-labelledby="search-heading">
      <div class="container">
        <h2 id="search-heading" class="mb-4">Search rooms</h2>

        <form class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="search-neighborhood" class="form-label">Neighborhood</label>
            <select id="search-neighborhood" name="neighborhood" class="form-select">
              <option value="" selected>Any neighborhood</option>
              <option value="chapinero">Chapinero</option>
              <option value="usaquen">Usaquén</option>
              <option value="teusaquillo">Teusaquillo</option>
              <option value="la-candelaria">La Candelaria</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="search-max-rent" class="form-label">Maximum rent</label>
            <input type="number" id="search-max-rent" name="max_rent" class="form-control"
                   placeholder="e.g. 1500000" min="0" step="50000">
          </div>

          <div class="col-md-4">
            <label for="search-available-from" class="form-label">Available from</label>
            <input type="date" id="search-available-from" name="available_from" class="form-control">
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary">Search rooms</button>
          </div>
        </form>
      </div>
    </section>

    <!-- featured listings, how it works go here -->
  </main>

  <footer>
    <!-- footer goes here -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
