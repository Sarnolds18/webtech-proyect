# Roomies production: one AWS EC2 server (Ubuntu, x86-64) running the app, kamal-proxy with a
# Let's Encrypt certificate, and PostgreSQL as an accessory. Set these variables on the laptop before
# running Kamal (see README "Deployment"); secrets come from .kamal/secrets, never from this file.
<% server_ip = ENV.fetch("ROOMIES_SERVER_IP") %>
<% app_host = ENV.fetch("ROOMIES_HOST") { "#{server_ip.tr('.', '-')}.sslip.io" } %>
service: roomies
image: <%= "#{ENV.fetch('KAMAL_REGISTRY_USERNAME')}/roomies".to_json %>

servers:
  web:
    - <%= server_ip.to_json %>

# HTTPS: kamal-proxy gets a Let's Encrypt certificate for this host name, which must resolve to the
# server. Without a domain of our own, <ip-with-dashes>.sslip.io resolves to the IP for free.
proxy:
  ssl: true
  host: <%= app_host.to_json %>
  app_port: 80
  healthcheck:
    path: /up

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME").to_json %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: ubuntu
  keys:
    - <%= ENV.fetch("ROOMIES_SSH_KEY").to_json %>
  keys_only: true
  forward_agent: false

env:
  secret:
    - RAILS_MASTER_KEY
    - ROOMIES_DATABASE_PASSWORD
  clear:
    APP_HOST: <%= app_host.to_json %>
    DB_HOST: roomies-db
    # Solid Queue runs inside Puma and delivers the notification emails.
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 1
    WEB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Active Storage photos and their variants live outside the application container.
volumes:
  - "roomies_storage:/rails/storage"

asset_path: /rails/public/assets
deploy_timeout: 180

# The image is built on the server itself (a remote builder over SSH) and pushed from there to
# Docker Hub: the laptop's upload link is too slow to push the image. Docker's SSH client needs the
# key for this host in ~/.ssh/config.
builder:
  arch: amd64
  local: false
  remote: <%= "ssh://ubuntu@#{server_ip}".to_json %>

accessories:
  db:
    image: postgres:18
    host: <%= server_ip.to_json %>
    network: kamal
    # No host port is published; Rails reaches PostgreSQL over the Kamal network only.
    env:
      clear:
        # Superuser, so db:prepare can create the primary, cache, queue and cable databases.
        POSTGRES_USER: roomies
        POSTGRES_DB: roomies_production
      secret:
        - POSTGRES_PASSWORD:ROOMIES_DATABASE_PASSWORD
    # PostgreSQL 18 keeps its data directory inside this version-independent mount.
    volumes:
      - "roomies_postgres:/var/lib/postgresql"
